<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>feliz cumple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top: #fff5f9;
    --bg-mid: #ffd9e7;
    --bg-low: #ffb8d2;
    --bg-bottom: #ff9ec0;
    --ink: #7a3552;
    --gold: #ff8fb8;
    --seal: #ff9ec0;
    --seal-dark: #c24f7c;
    --paper: #fff7fa;
    --paper-edge: #ffd3e2;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    background: #3b7fd6 url('assets/fondo-xp.jpg') center center / cover no-repeat;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .scene{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== AMBIENT SPARKLES ===== */
  .ambient{ position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .ambient span{
    position: absolute;
    width: 10px; height: 10px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    opacity: 0.55;
    animation: float-up 7s ease-in-out infinite;
  }
  @keyframes float-up{
    0%{ transform: translateY(0) rotate(0deg); opacity: 0; }
    15%{ opacity: 0.6; }
    50%{ transform: translateY(-40px) rotate(180deg); }
    85%{ opacity: 0.5; }
    100%{ transform: translateY(-90px) rotate(360deg); opacity: 0; }
  }

  /* ===== STICKERS ===== */
  .sticker{
    position: fixed;
    width: 56px;
    opacity: 0.85;
    z-index: 2;
    filter: drop-shadow(0 8px 10px rgba(190,80,120,0.25));
    animation: sticker-sway 5s ease-in-out infinite;
  }
  .sticker img{ width: 100%; height: auto; display: block; }
  .s1{ top: 6%; left: 6%; animation-delay: 0s; }
  .s2{ top: 8%; right: 7%; width: 48px; animation-delay: 1.2s; }
  .s3{ bottom: 8%; left: 8%; width: 48px; animation-delay: 0.6s; }
  .s4{ bottom: 6%; right: 6%; animation-delay: 1.8s; }
  @keyframes sticker-sway{
    0%,100%{ transform: rotate(-4deg) translateY(0); }
    50%{ transform: rotate(4deg) translateY(-6px); }
  }
  @media (max-width: 480px){
    .sticker{ width: 44px; }
    .s2, .s3{ width: 38px; }
  }

  /* ===== INTRO (envelope) ===== */
  .intro{
    position: fixed;
    left: 0; top: 0;
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    will-change: transform;
  }
  .intro.live{ opacity: 1; pointer-events: auto; }
  .intro.hide{
    opacity: 0;
    pointer-events: none;
  }
  .touch-me{
    margin: 0;
    font-family: 'Dancing Script', cursive;
    font-size: 1.9rem;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,40,90,0.65), 0 0 2px rgba(0,40,90,0.8);
    letter-spacing: 0.03em;
    visibility: hidden;   /* aparece y desaparece de golpe, sin animación */
  }
  .touch-me.on{ visibility: visible; }
  /* sobre chiquito: caja de 156x104 que contiene el sobre original a 60% */
  .env-scale{ position: relative; width: 104px; height: 69px; }
  .env-inner{
    position: absolute; left: 0; top: 0;
    width: 260px; height: 172px;
    transform: scale(0.4);
    transform-origin: 0 0;
  }

  /* ===== PANTALLA INICIAL (fondo negro + regalo "ábreme") ===== */
  .gate{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    cursor: pointer;
    transition: opacity 0.9s ease;
  }
  .gate.open{ opacity: 0; pointer-events: none; }
  .gate-text{
    margin: 0;
    font-family: 'Dancing Script', cursive;
    font-size: 1.9rem;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,150,200,0.8);
    animation: hint-pulse 1.4s ease-in-out infinite;
    transition: opacity 0.3s ease;
  }
  .gate.open .gate-text{ opacity: 0; }
  .gate-gift{
    width: 112px;
    height: auto;
    display: block;
    transform: translate(var(--gx, 0px), var(--gy, 0px)) rotate(var(--gr, 0deg));
    will-change: transform;
  }
  .gate.open .gate-gift{ animation: gate-gift-out 0.6s ease-in forwards; }
  @keyframes gate-gift-out{
    0%{ transform: translate(var(--gx, 0px), var(--gy, 0px)) rotate(var(--gr, 0deg)) scale(1); opacity: 1; }
    100%{ transform: translate(var(--gx, 0px), var(--gy, 0px)) rotate(0deg) scale(1.7); opacity: 0; }
  }

  /* ===== SPLASH (happy birthday + gatitos) ===== */
  .splash{
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2vh;
    padding-bottom: 12vh;
    pointer-events: none;
    transition: opacity 0.6s ease;
    visibility: hidden;
  }
  .splash.go{ visibility: visible; }
  .splash.hide{ opacity: 0; }
  .splash img{
    display: block;
    height: auto;
    filter: drop-shadow(0 6px 10px rgba(0,30,80,0.35));
  }
  .splash.go img{
    animation: splash-pop 0.8s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .sp-hb{ width: min(35.5vw, 190px); }
  .sp-cats{ width: min(29.7vw, 160px); animation-delay: 0.15s; }
  @keyframes splash-pop{
    0%{ opacity: 0; transform: scale(0.5); }
    100%{ opacity: 1; transform: scale(1); }
  }
  .intro-title{
    font-family: 'Dancing Script', cursive;
    font-size: 3rem;
    color: var(--seal-dark);
    margin: 0;
    text-shadow: 0 4px 10px rgba(200,80,130,0.25);
  }

  .envelope-dodge{
    transition: transform 0.45s cubic-bezier(.34,1.6,.4,1);
  }
  .envelope-outer{
    animation: env-sway 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes env-sway{
    0%,100%{ transform: rotate(-3deg); }
    50%{ transform: rotate(3deg); }
  }

  .envelope{
    position: relative;
    width: 260px;
    height: 172px;
    cursor: pointer;
  }
  .envelope.pulse{
    animation: envelope-pulse 0.65s ease-in-out;
  }
  @keyframes envelope-pulse{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    20%{ transform: translateX(-9px) rotate(-4deg); }
    40%{ transform: translateX(7px) rotate(3deg); }
    60%{ transform: translateX(-5px) rotate(-2deg); }
    80%{ transform: translateX(3px) rotate(1deg); }
  }
  .envelope-body{
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #fff3f7, #ffd6e5);
    border-radius: 10px;
    box-shadow: 0 18px 30px rgba(200,90,130,0.28);
  }
  .envelope-body::before{
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 49.4%, rgba(200,90,130,0.12) 50%, transparent 50.6%),
      linear-gradient(45deg, transparent 49.4%, rgba(200,90,130,0.12) 50%, transparent 50.6%);
    border-radius: 10px;
  }
  .flap{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 92px;
    background: linear-gradient(160deg, #ffdbe8, #ff9fc4);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(.6,-0.2,.3,1.4);
    z-index: 3;
  }
  .envelope.open .flap{ transform: rotateX(180deg); }
  .seal{
    position: absolute;
    top: 78px; left: 50%;
    transform: translate(-50%, -50%);
    width: 46px; height: 46px;
    z-index: 4;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .seal img{ width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(200,90,130,0.35)); }
  .envelope.open .seal{ opacity: 0; transform: translate(-50%,-50%) scale(0.4); }

  .hint{
    font-size: 1.15rem;
    color: var(--seal-dark);
    letter-spacing: 0.04em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }
  @keyframes hint-pulse{
    0%,100%{ opacity: 0.55; }
    50%{ opacity: 1; }
  }

  /* ===== FLYBY IMAGES (cruzan la pantalla tipo avioncito) ===== */
  .flyby-layer{
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
  }
  .flyby{
    position: fixed;
    left: 0;
    top: 0;
    width: var(--size, 90px);
    opacity: 0;
    animation: fly-across var(--dur, 13s) linear infinite;
    animation-delay: var(--delay, 0s);
    animation-fill-mode: backwards;
  }
  @keyframes fly-across{
    0%{   transform: translate(var(--x0), var(--y0)); opacity: 0; }
    6%{   opacity: 1; }
    94%{  opacity: 1; }
    100%{ transform: translate(var(--x1), var(--y1)); opacity: 0; }
  }
  .flyby-spin{
    animation: cartoon-wiggle 8s steps(1) infinite;
  }
  .flyby-spin img{
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 8px 10px rgba(190,80,120,0.3));
  }
  @keyframes cartoon-wiggle{
    0%{   transform: rotate(-4deg) translateY(0); }
    12.5%{ transform: rotate(3deg) translateY(-4px); }
    25%{  transform: rotate(-2deg) translateY(2px); }
    37.5%{ transform: rotate(4deg) translateY(-3px); }
    50%{  transform: rotate(-3deg) translateY(1px); }
    62.5%{ transform: rotate(2deg) translateY(-4px); }
    75%{  transform: rotate(-4deg) translateY(0); }
    87.5%{ transform: rotate(3deg) translateY(2px); }
    100%{ transform: rotate(-4deg) translateY(0); }
  }

  /* ===== LETTER ===== */
  .letter{
    position: fixed;
    z-index: 10;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.35);
    width: min(88vw, 480px);
    max-height: 82vh;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 16px;
    padding: 2.2rem 1.8rem 2rem;
    box-shadow: 0 30px 60px rgba(190,80,120,0.35);
    opacity: 0;
    pointer-events: none;
  }
  .letter-mark{
    display: block;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: 2rem;
    margin-bottom: 1.2rem;
    letter-spacing: 0.03em;
  }

  @keyframes letter-grow-shake{
    0%{   opacity: 0;   transform: translate(-50%,-50%) scale(0.35) rotate(0deg); }
    6%{   opacity: 1; }
    10%{  transform: translate(calc(-50% - 10px),-50%) scale(0.42) rotate(-4deg); }
    20%{  transform: translate(calc(-50% + 9px),-50%)  scale(0.53) rotate(3.5deg); }
    30%{  transform: translate(calc(-50% - 8px),-50%)  scale(0.65) rotate(-3deg); }
    40%{  transform: translate(calc(-50% + 6px),-50%)  scale(0.77) rotate(2.4deg); }
    50%{  transform: translate(calc(-50% - 5px),-50%)  scale(0.87) rotate(-1.8deg); }
    60%{  transform: translate(calc(-50% + 4px),-50%)  scale(0.95) rotate(1.2deg); }
    70%{  transform: translate(calc(-50% - 3px),-50%)  scale(1.02) rotate(-0.7deg); }
    80%{  transform: translate(calc(-50% + 2px),-50%)  scale(1.01) rotate(0.4deg); }
    90%{  transform: translate(calc(-50% - 1px),-50%)  scale(1.0) rotate(-0.2deg); }
    100%{ opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  .letter.grow-shake{
    animation: letter-grow-shake 1.3s cubic-bezier(.2,.7,.3,1) forwards;
    pointer-events: auto;
  }

  .msg-wrap{ position: relative; }
  .msg-block{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink);
    font-size: 1.18rem;
    line-height: 1.8;
    text-align: center;
    margin: 0 0 1.4rem;
    opacity: 0;
  }
  .msg-block.fade-in{
    animation: msg-fade 0.6s ease forwards;
  }
  @keyframes msg-fade{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .msg-peek{
    cursor: pointer;
    text-align: center;
    padding: 0.4rem 0 0.2rem;
  }
  .msg-peek p{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink);
    opacity: 0.28;
    filter: blur(1.6px);
    margin: 0 0 0.5rem;
    transition: opacity 0.3s ease, filter 0.3s ease;
    -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
            mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
  }
  .msg-peek:active p{ opacity: 0.45; filter: blur(0.8px); }
  .peek-hint{
    display: inline-block;
    font-family: 'Dancing Script', cursive;
    font-size: 1.05rem;
    color: var(--seal-dark);
    letter-spacing: 0.03em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }

  .msg-sign{
    font-family: 'Dancing Script', cursive;
    font-size: 1.3rem;
    text-align: center;
    color: var(--seal-dark);
    margin-top: 0.6rem;
  }

  /* ===== BURST (corazones + confeti) ===== */
  .burst{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }
  .burst img, .burst .confetti{
    position: absolute;
    top: 50%;
    left: 50%;
    opacity: 0;
    animation: burst-out 1.6s ease-out forwards;
  }
  .burst img{
    width: 24px;
    height: auto;
    filter: drop-shadow(0 0 8px rgba(255,140,190,0.75)) drop-shadow(0 2px 3px rgba(190,80,120,0.35));
  }
  .burst .confetti{
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }
  @keyframes burst-out{
    0%{ transform: translate(-50%,-50%) scale(0.3) rotate(0deg); opacity: 0; }
    12%{ opacity: 1; }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  /* ===== SORPRESA (regalo -> pastel -> yay) ===== */
  @keyframes letter-leave{
    0%{ opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100%{ opacity: 0; transform: translate(-50%,-62%) scale(0.6); }
  }
  .letter.leave{
    animation: letter-leave 0.65s ease-in forwards;
    pointer-events: none;
  }
  .surprise{
    position: fixed;
    z-index: 10;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0.3);
    width: min(88vw, 420px);
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 16px;
    padding: 1.8rem 1.4rem 1.6rem;
    box-shadow: 0 30px 60px rgba(190,80,120,0.35);
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }
  @keyframes surprise-in{
    0%{ opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(-6deg); }
    60%{ opacity: 1; transform: translate(-50%,-50%) scale(1.06) rotate(2deg); }
    100%{ opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  .surprise.show{
    animation: surprise-in 0.9s cubic-bezier(.2,.8,.3,1) forwards;
    pointer-events: auto;
  }
  .surprise-title{
    font-family: 'Dancing Script', cursive;
    font-size: 1.9rem;
    color: var(--seal-dark);
    margin: 0 0 0.4rem;
    text-wrap: balance;
  }
  .surprise-stage{
    position: relative;
    height: 150px;
    width: 100%;
  }
  .surprise-stage img{
    position: absolute;
    top: 0; bottom: 0; left: 0; right: 0;
    margin: auto;
    height: 100%;
    width: 100%;
    transform: scale(1);
    object-fit: contain;
    cursor: pointer;
    transition: opacity 0.4s ease, transform 0.4s ease;
    -webkit-user-drag: none;
  }
  .surprise-stage img.hidden{
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
  }
  /* regalo chiquito que flota a la deriva como colgado de un globo */
  .surprise-stage img.gift{
    width: 72px;
    height: auto;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg));
    transform-origin: 50% 12%;
    will-change: transform;
  }
  .gift.opening{
    animation: gift-open 0.6s ease-in forwards;
  }
  @keyframes gift-open{
    0%{ transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg)) scale(1); }
    20%{ transform: translate(calc(var(--dx, 0px) - 8px), var(--dy, 0px)) rotate(-6deg) scale(1.05); }
    40%{ transform: translate(calc(var(--dx, 0px) + 8px), var(--dy, 0px)) rotate(6deg) scale(1.1); }
    60%{ transform: translate(calc(var(--dx, 0px) - 6px), var(--dy, 0px)) rotate(-5deg) scale(1.15); }
    100%{ transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(0deg) scale(1.4); opacity: 0; }
  }
  .cake.vibrate{ animation: cake-vibrate 0.12s linear infinite; }
  @keyframes cake-vibrate{
    0%{ transform: translateX(-7px) rotate(-3deg); }
    50%{ transform: translateX(7px) rotate(3deg); }
    100%{ transform: translateX(-7px) rotate(-3deg); }
  }
  .slice.pop{ animation: slice-pop 0.7s cubic-bezier(.2,.9,.3,1.4) forwards; }
  @keyframes slice-pop{
    0%{ transform: scale(0.4) rotate(-8deg); opacity: 0; }
    100%{ transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .surprise-final{
    font-family: 'Dancing Script', cursive;
    font-size: 1.5rem;
    line-height: 1.4;
    color: var(--seal-dark);
    margin: 0.8rem 0 0;
    opacity: 0;
    text-wrap: balance;
  }
  .surprise-final.show{ animation: msg-fade 0.9s ease forwards; }
  .surprise-hint{
    font-family: 'Dancing Script', cursive;
    font-size: 1.15rem;
    color: var(--seal-dark);
    margin: 0.6rem 0 0;
    min-height: 1.6em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .ambient span, .hint, .sticker, .peek-hint{ animation: none; }
    .flap, .letter, .seal{ transition-duration: 0.2s; }
    .letter.grow-shake{ animation: none; opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="ambient" id="ambient"></div>
  <div class="flyby-layer" id="flybyLayer"></div>

  <div class="splash" id="splash">
    <img class="sp-hb" src="assets/happy-birthday.gif" alt="">
    <img class="sp-cats" src="assets/gatitos-corazon.gif" alt="">
  </div>

  <div class="intro" id="intro">
    <p class="touch-me" id="touchMe">¡Hey!</p>
    <div class="env-scale">
      <div class="env-inner">
        <div class="envelope-dodge" id="envelopeDodge">
          <div class="envelope-outer">
            <div class="envelope" id="envelope">
              <div class="envelope-body"></div>
              <div class="seal" id="seal"><img src="assets/corazon.png" alt=""></div>
              <div class="flap" id="flap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="letter" id="letter">
    <span class="letter-mark">¡feliz cumpleaños!</span>
    <div class="msg-wrap">
      <p class="msg-block" id="msgBlock"></p>
      <div class="msg-peek" id="msgPeek">
        <p id="msgPeekText"></p>
        <span class="peek-hint">toca para seguir leyendo</span>
      </div>
      <p class="msg-sign" id="msgSign" style="display:none;">🫀🥳🫀</p>
    </div>
  </div>

  <div class="surprise" id="surprise">
    <h2 class="surprise-title" id="surpriseTitle">Tengo una sorpresa para ti</h2>
    <div class="surprise-stage">
      <img class="gift" id="giftImg" src="assets/regalo.gif" alt="">
      <img class="cake hidden" id="cakeImg" src="assets/pastel-velas.gif" alt="">
      <img class="slice hidden" id="sliceImg" src="assets/pastel-cortado.gif" alt="">
    </div>
    <p class="surprise-hint" id="surpriseHint">toca el regalo</p>
    <p class="surprise-final" id="surpriseFinal">Si te gustó, escríbeme tortita por WhatsApp 🍰</p>
  </div>

  <div class="burst" id="burst"></div>
</div>

<div class="gate" id="gate">
  <p class="gate-text">ábreme</p>
  <img class="gate-gift" id="gateGift" src="assets/caja-kuromi.png" alt="">
</div>

<audio id="bgMusic" src="assets/musica.mp3" loop preload="auto"></audio>
<audio id="yaySound" src="assets/yay.mp3" preload="auto"></audio>

<script>
  const ambient = document.getElementById('ambient');
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = (60 + Math.random()*40) + '%';
    s.style.animationDelay = (Math.random()*7) + 's';
    s.style.animationDuration = (5 + Math.random()*4) + 's';
    s.style.transform = 'scale(' + (0.6 + Math.random()*0.9) + ')';
    ambient.appendChild(s);
  }

  const flybyLayer = document.getElementById('flybyLayer');
  const flybyImages = [
    'assets/gato-angel.gif',
    'assets/banner-cumple.gif',
    'assets/pastel-anim.gif',
    'assets/hellokitty-confeti.gif',
    'assets/kuromi-pastel.gif',
    'assets/sanrio-grupo.jpg',
    'assets/gato-sombrero1.jpg',
    'assets/gato-sombrero2.jpg',
    'assets/gatito-pastel.jpg'
  ];
  const diagonals = [
    { x0: '-25vw', y0: '115vh', x1: '125vw', y1: '-25vh' }, // abajo-izq -> arriba-der
    { x0: '125vw', y0: '-25vh', x1: '-25vw', y1: '115vh' }, // arriba-der -> abajo-izq
    { x0: '-25vw', y0: '-25vh', x1: '125vw', y1: '115vh' }, // arriba-izq -> abajo-der
    { x0: '125vw', y0: '115vh', x1: '-25vw', y1: '-25vh' }  // abajo-der -> arriba-izq
  ];

  flybyImages.forEach((src, i) => {
    const diag = diagonals[i % diagonals.length];
    const wrap = document.createElement('div');
    wrap.className = 'flyby';
    wrap.style.setProperty('--x0', diag.x0);
    wrap.style.setProperty('--y0', diag.y0);
    wrap.style.setProperty('--x1', diag.x1);
    wrap.style.setProperty('--y1', diag.y1);
    wrap.style.setProperty('--size', (46 + Math.random()*30) + 'px');
    wrap.style.setProperty('--dur', (11 + Math.random()*6) + 's');
    wrap.style.setProperty('--delay', (i*1.4 + Math.random()*2) + 's');

    const spin = document.createElement('div');
    spin.className = 'flyby-spin';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    spin.appendChild(img);
    wrap.appendChild(spin);
    flybyLayer.appendChild(wrap);
  });

  const envelope = document.getElementById('envelope');
  const envelopeDodge = document.getElementById('envelopeDodge');
  const intro = document.getElementById('intro');
  const letter = document.getElementById('letter');
  const burstLayer = document.getElementById('burst');
  const bgMusic = document.getElementById('bgMusic');

  const msgBlockEl = document.getElementById('msgBlock');
  const msgPeek = document.getElementById('msgPeek');
  const msgPeekText = document.getElementById('msgPeekText');
  const msgSign = document.getElementById('msgSign');

  // EDITA ESTE ARREGLO con tu mensaje real, cada elemento es un bloque
  // que se va a mostrar de a poco (el usuario toca para ver el siguiente).
  const msgBlocks = [
    "Olaa Feliz cumpleaños\nespero que la pases muy bien\nte quiero mucho,\naquí en las estrellas y la luna,",
    "espero cumplas muchos más\ny espero no olvides\nlo importante que eres para mi,\ncome mucha torta",
    "cuídate\nte quiero muchisiimo"
  ];
  let current = 0;

  function renderMsg(){
    msgBlockEl.classList.remove('fade-in');
    msgBlockEl.innerHTML = msgBlocks[current].split('\n').join('<br>');
    void msgBlockEl.offsetWidth;
    msgBlockEl.classList.add('fade-in');

    if(current + 1 < msgBlocks.length){
      const nextFirstLine = msgBlocks[current + 1].split('\n')[0];
      msgPeekText.innerHTML = nextFirstLine;
      msgPeek.style.display = 'block';
      msgSign.style.display = 'none';
    } else {
      msgPeek.style.display = 'none';
      msgSign.style.display = 'block';
      scheduleSurprise();
    }
  }

  msgPeek.addEventListener('click', () => {
    if(current + 1 < msgBlocks.length){
      current++;
      renderMsg();
    }
  });

  const confettiColors = ['#ff8fb8', '#ffb3cf', '#ff6fa3', '#ffc9dc', '#f7a1c4', '#ffd6e5'];

  function spawnParticle(x, y, dx, dy, rot, delay){
    const isHeart = Math.random() < 0.5;
    let p;
    if(isHeart){
      p = document.createElement('img');
      p.src = 'assets/corazon.png';
      p.alt = '';
      p.style.width = (12 + Math.random()*12) + 'px';
    } else {
      p = document.createElement('div');
      p.className = 'confetti';
      p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      p.style.width = (7 + Math.random()*6) + 'px';
      p.style.height = (10 + Math.random()*8) + 'px';
    }
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--dy', dy + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    p.style.left = x;
    p.style.top = y;
    p.style.animationDelay = delay + 's';
    burstLayer.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }

  function heartBurst(count){
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const dist = 120 + Math.random()*260;
      spawnParticle('50%', '45%', Math.cos(angle)*dist, Math.sin(angle)*dist, Math.random()*360-180, Math.random()*0.25);
    }
  }

  function burstAt(x, y, count){
    const scale = 6;
    for(let i=0;i<count;i++){
      const t = (i / count) * Math.PI * 2;
      const dx = scale * 16 * Math.pow(Math.sin(t), 3);
      const dy = -scale * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      spawnParticle(x+'px', y+'px', dx, dy, Math.random()*360-180, (i/count)*0.18 + Math.random()*0.05);
    }
  }

  document.addEventListener('click', (e) => {
    burstAt(e.clientX, e.clientY, 20);
  });

  // ===== SPLASH (2 s) -> el sobre sale volando de una esquina =====
  const splash = document.getElementById('splash');
  const touchMe = document.getElementById('touchMe');
  let flightRaf = null;
  let touchTimer = null;
  let heyHideTimer = null;
  // ===== VOLUMENES (0 = silencio, 1 = maximo). Cambia estos numeros a gusto =====
  const VOL = { musica: 0.35, hey: 0.45, yay: 0.9 };
  let audioCtx = null;
  const gainNodes = new Map();
  function routeAudio(el, key){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) throw new Error('sin WebAudio');
      if(!audioCtx) audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(el);
      const g = audioCtx.createGain();
      g.gain.value = VOL[key];
      src.connect(g);
      g.connect(audioCtx.destination);
      gainNodes.set(el, g);
    }catch(e){
      el.volume = VOL[key];   // respaldo
    }
  }
  function setVolume(el, v){
    const g = gainNodes.get(el);
    if(g) g.gain.value = v; else el.volume = v;
  }
  function getVolume(el){
    const g = gainNodes.get(el);
    return g ? g.gain.value : el.volume;
  }

  const heySound = new Audio('assets/hey.mp3');
  heySound.preload = 'auto';

  function heyOnce(){
    heySound.currentTime = 0;
    heySound.play().catch(() => {});   // el navegador lo bloquea hasta el primer toque
    touchMe.classList.add('on');
    clearTimeout(heyHideTimer);
    heyHideTimer = setTimeout(() => touchMe.classList.remove('on'), 600);
  }

  // desbloquea el audio con el primer toque en cualquier parte de la pantalla
  function unlockHey(){
    heySound.muted = true;
    heySound.play().then(() => {
      heySound.pause();
      heySound.currentTime = 0;
      heySound.muted = false;
    }).catch(() => { heySound.muted = false; });
  }
  document.addEventListener('click', unlockHey, { once: true });

  function startFlight(){
    const iw = intro.offsetWidth, ih = intro.offsetHeight;
    const W = () => window.innerWidth, H = () => window.innerHeight;
    const corners = [
      { x: -iw, y: H() * 0.9 }, { x: W() + iw, y: H() * 0.85 },
      { x: -iw, y: H() * 0.15 }, { x: W() + iw, y: H() * 0.2 }
    ];
    const pos = corners[Math.floor(Math.random()*corners.length)];
    const vel = { x: 0, y: 0 };
    let target = { x: W()/2, y: H()/2 };
    function pickTarget(){
      target = {
        x: iw/2 + Math.random() * (W() - iw),
        y: ih/2 + 40 + Math.random() * (H() - ih - 80)
      };
    }
    pickTarget();
    const t0 = performance.now();
    let last = t0;
    intro.classList.add('live');
    function frame(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const dx = target.x - pos.x, dy = target.y - pos.y;
      const dist = Math.hypot(dx, dy) || 1;
      if(dist < 50) pickTarget();
      const speed = 105;
      vel.x += ((dx / dist) * speed - vel.x) * Math.min(1, dt * 1.4);
      vel.y += ((dy / dist) * speed - vel.y) * Math.min(1, dt * 1.4);
      pos.x += vel.x * dt;
      pos.y += vel.y * dt;
      const t = (now - t0) / 1000;
      const bob = Math.sin(t * 3.2) * 7;
      const tilt = Math.max(-12, Math.min(12, vel.x / speed * 12));
      intro.style.transform =
        'translate(' + (pos.x - iw/2).toFixed(1) + 'px,' + (pos.y - ih/2 + bob).toFixed(1) + 'px) rotate(' + tilt.toFixed(1) + 'deg)';
      flightRaf = requestAnimationFrame(frame);
    }
    flightRaf = requestAnimationFrame(frame);

    // cada 5 s: suena el "Hey!" y el texto aparece y desaparece
    heyOnce();
    touchTimer = setInterval(heyOnce, 5000);
  }
  function stopFlight(){
    if(flightRaf) cancelAnimationFrame(flightRaf);
    flightRaf = null;
    clearInterval(touchTimer);
    clearTimeout(heyHideTimer);
    touchMe.classList.remove('on');
    heySound.pause();
  }

  let splashStarted = false;
  function startSplash(){
    if(splashStarted) return;
    splashStarted = true;
    splash.classList.add('go');
    // los GIFs se quedan hasta que se abre la carta; a los 2 s sale volando el sobre
    setTimeout(startFlight, 2000);
  }

  const envelopePulse = setInterval(() => {
    envelope.classList.add('pulse');
    setTimeout(() => envelope.classList.remove('pulse'), 700);
  }, 3000);

  let envelopeTaps = 0;
  let dodgeDir = 1;
  let musicStarted = false;

  envelope.addEventListener('click', () => {
    if(!musicStarted){
      bgMusic.play().catch(() => {});
      musicStarted = true;
    }

    envelopeTaps++;

    if(envelopeTaps < 7){
      const dx = (Math.random()*180 - 90);
      const dy = dodgeDir * -(70 + Math.random()*50);
      const scale = 0.6 + Math.random()*0.8;
      envelopeDodge.style.transform =
        'translate(' + dx + 'px,' + dy + 'px) scale(' + scale.toFixed(2) + ')';
      dodgeDir *= -1;
      return;
    }

    envelopeDodge.style.transform = 'translate(0,0) scale(1)';
    clearInterval(envelopePulse);
    stopFlight();
    envelope.classList.remove('pulse');
    envelope.classList.add('open');
    heartBurst(46);

    setTimeout(() => {
      intro.classList.add('hide');
      splash.classList.add('hide');
      letter.classList.add('grow-shake');
    }, 650);
  });

  letter.addEventListener('animationend', function onGrowShake(e){
    if(e.animationName === 'letter-grow-shake'){
      renderMsg();
      letter.removeEventListener('animationend', onGrowShake);
    }
  });

  // ===== SORPRESA: carta -> regalo -> pastel -> agitar -> yay =====
  const surprise = document.getElementById('surprise');
  const surpriseTitle = document.getElementById('surpriseTitle');
  const surpriseHint = document.getElementById('surpriseHint');
  const giftImg = document.getElementById('giftImg');
  const cakeImg = document.getElementById('cakeImg');
  const sliceImg = document.getElementById('sliceImg');
  const yaySound = document.getElementById('yaySound');
  const surpriseFinal = document.getElementById('surpriseFinal');

  let surpriseScheduled = false;
  function scheduleSurprise(){
    if(surpriseScheduled) return;
    surpriseScheduled = true;
    // 2 segundos despues del ultimo mensaje se va la carta y entra la sorpresa
    setTimeout(() => {
      letter.classList.remove('grow-shake');
      letter.classList.add('leave');
      setTimeout(() => {
        surprise.classList.add('show');
        startGiftDrift();
        heartBurst(24);
      }, 700);
    }, 2000);
  }

  // El regalo flota de un lado a otro de forma "aleatoria" (suma de ondas lentas)
  let driftRaf = null;
  const driftPhase = [0,1,2,3].map(() => Math.random() * Math.PI * 2);
  function startGiftDrift(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const stage = giftImg.parentElement;
    const t0 = performance.now();
    function frame(now){
      const t = (now - t0) / 1000;
      const ax = Math.max(20, (stage.clientWidth - giftImg.offsetWidth) / 2 * 0.92);
      const ay = Math.max(12, (stage.clientHeight - giftImg.offsetHeight) / 2 * 0.8);
      const wx = 0.6 * Math.sin(t * 0.85 + driftPhase[0]) + 0.4 * Math.sin(t * 1.65 + driftPhase[1]);
      const wy = 0.6 * Math.sin(t * 0.65 + driftPhase[2]) + 0.4 * Math.sin(t * 1.25 + driftPhase[3]);
      const tilt = 0.6 * Math.cos(t * 0.85 + driftPhase[0]) + 0.4 * Math.cos(t * 1.65 + driftPhase[1]);
      giftImg.style.setProperty('--dx', (wx * ax).toFixed(1) + 'px');
      giftImg.style.setProperty('--dy', (wy * ay).toFixed(1) + 'px');
      giftImg.style.setProperty('--rot', (tilt * 9).toFixed(1) + 'deg');
      driftRaf = requestAnimationFrame(frame);
    }
    driftRaf = requestAnimationFrame(frame);
  }
  function stopGiftDrift(){
    if(driftRaf) cancelAnimationFrame(driftRaf);
    driftRaf = null;
  }

  let giftOpened = false;
  let cakeCut = false;
  let cakeTapReady = false;
  let shakes = 0;
  let lastShake = 0;
  let lx = null, ly = null, lz = null;
  let vibrateTimer = null;
  const SHAKES_NEEDED = 6;

  function onMotion(e){
    const a = e.accelerationIncludingGravity;
    if(!a || a.x == null) return;
    if(lx === null){ lx = a.x; ly = a.y; lz = a.z; return; }
    const d = Math.abs(a.x - lx) + Math.abs(a.y - ly) + Math.abs(a.z - lz);
    lx = a.x; ly = a.y; lz = a.z;
    const now = Date.now();
    if(d > 22 && now - lastShake > 120){
      lastShake = now;
      shakes++;
      cakeImg.classList.add('vibrate');
      if(navigator.vibrate) navigator.vibrate(60);
      clearTimeout(vibrateTimer);
      vibrateTimer = setTimeout(() => cakeImg.classList.remove('vibrate'), 400);
      if(shakes >= SHAKES_NEEDED) cutCake();
    }
  }

  function startShakeListening(){
    if(typeof DeviceMotionEvent !== 'undefined' &&
       typeof DeviceMotionEvent.requestPermission === 'function'){
      // iPhone: hay que pedir permiso dentro de un toque
      DeviceMotionEvent.requestPermission().then(r => {
        if(r === 'granted') window.addEventListener('devicemotion', onMotion);
      }).catch(() => {});
    } else {
      window.addEventListener('devicemotion', onMotion);
    }
  }

  giftImg.addEventListener('click', () => {
    if(giftOpened) return;
    giftOpened = true;
    stopGiftDrift();
    startShakeListening();

    // "desbloquea" el audio con el toque para que suene luego sin problema
    yaySound.muted = true;
    yaySound.play().then(() => {
      yaySound.pause();
      yaySound.currentTime = 0;
      yaySound.muted = false;
    }).catch(() => { yaySound.muted = false; });

    giftImg.classList.add('opening');
    surpriseHint.textContent = '';
    setTimeout(() => {
      giftImg.classList.add('hidden');
      cakeImg.classList.remove('hidden');
      surpriseTitle.textContent = '¡Agita el teléfono!';
      surpriseHint.textContent = 'agítalo fuerte';
    }, 600);

    // respaldo por si el telefono no detecta el movimiento
    setTimeout(() => {
      if(cakeCut) return;
      cakeTapReady = true;
      surpriseHint.textContent = 'o toca el pastel';
    }, 6600);
  });

  cakeImg.addEventListener('click', () => {
    if(cakeTapReady) cutCake();
  });

  function cutCake(){
    if(cakeCut) return;
    cakeCut = true;
    window.removeEventListener('devicemotion', onMotion);
    clearTimeout(vibrateTimer);
    cakeImg.classList.remove('vibrate');
    cakeImg.classList.add('hidden');
    sliceImg.classList.remove('hidden');
    sliceImg.classList.add('pop');
    surpriseTitle.textContent = '¡Feliz cumpleaños!';
    surpriseHint.textContent = '';

    const prevVol = getVolume(bgMusic);
    setVolume(bgMusic, Math.min(prevVol, 0.15));
    yaySound.currentTime = 0;
    yaySound.play().catch(() => {});
    yaySound.addEventListener('ended', () => { setVolume(bgMusic, prevVol); }, { once: true });

    heartBurst(70);
    setTimeout(() => heartBurst(50), 500);
    setTimeout(() => surpriseFinal.classList.add('show'), 1200);
  }

  // ===== PANTALLA INICIAL: primer toque (desbloquea musica y audios) =====
  const gate = document.getElementById('gate');
  const gateGift = document.getElementById('gateGift');
  let gateOpened = false;
  let gateRaf = null;
  const gatePhase = [0,1,2,3].map(() => Math.random() * Math.PI * 2);
  (function driftGate(){
    const t0 = performance.now();
    function frame(now){
      const t = (now - t0) / 1000;
      const wx = 0.6 * Math.sin(t * 0.9 + gatePhase[0]) + 0.4 * Math.sin(t * 1.7 + gatePhase[1]);
      const wy = 0.6 * Math.sin(t * 0.7 + gatePhase[2]) + 0.4 * Math.sin(t * 1.3 + gatePhase[3]);
      const tilt = 0.6 * Math.cos(t * 0.9 + gatePhase[0]) + 0.4 * Math.cos(t * 1.7 + gatePhase[1]);
      gateGift.style.setProperty('--gx', (wx * 55).toFixed(1) + 'px');
      gateGift.style.setProperty('--gy', (wy * 45).toFixed(1) + 'px');
      gateGift.style.setProperty('--gr', (tilt * 9).toFixed(1) + 'deg');
      gateRaf = requestAnimationFrame(frame);
    }
    gateRaf = requestAnimationFrame(frame);
  })();

  gate.addEventListener('click', () => {
    if(gateOpened) return;
    gateOpened = true;
    if(gateRaf) cancelAnimationFrame(gateRaf);
    gate.classList.add('open');
    routeAudio(bgMusic, 'musica');
    routeAudio(heySound, 'hey');
    routeAudio(yaySound, 'yay');
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(!musicStarted){
      bgMusic.play().catch(() => {});
      musicStarted = true;
    }
    startSplash();   // aparecen los GIFs y a los 2 s sale volando el sobre
    setTimeout(() => { gate.style.display = 'none'; }, 1000);
  });
</script>
</body>
</html>
