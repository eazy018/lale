<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>feliz cumple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top: #fffbe6;
    --bg-mid: #ffe98a;
    --bg-low: #ffd23f;
    --bg-bottom: #ffb703;
    --ink: #5a4412;
    --gold: #ff9f1c;
    --seal: #ffb703;
    --seal-dark: #c77d00;
    --paper: #fffdf4;
    --paper-edge: #ffedb0;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 38%, var(--bg-low) 70%, var(--bg-bottom) 100%);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .scene{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== AMBIENT SPARKLES ===== */
  .ambient{ position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .ambient span{
    position: absolute;
    width: 10px; height: 10px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    opacity: 0.55;
    animation: float-up 7s ease-in-out infinite;
  }
  @keyframes float-up{
    0%{ transform: translateY(0) rotate(0deg); opacity: 0; }
    15%{ opacity: 0.6; }
    50%{ transform: translateY(-40px) rotate(180deg); }
    85%{ opacity: 0.5; }
    100%{ transform: translateY(-90px) rotate(360deg); opacity: 0; }
  }

  /* ===== STICKERS ===== */
  .sticker{
    position: fixed;
    width: 78px;
    opacity: 0.85;
    z-index: 2;
    filter: drop-shadow(0 8px 10px rgba(150,110,10,0.25));
    animation: sticker-sway 5s ease-in-out infinite;
  }
  .sticker img{ width: 100%; height: auto; display: block; }
  .s1{ top: 6%; left: 6%; animation-delay: 0s; }
  .s2{ top: 8%; right: 7%; width: 66px; animation-delay: 1.2s; }
  .s3{ bottom: 8%; left: 8%; width: 66px; animation-delay: 0.6s; }
  .s4{ bottom: 6%; right: 6%; animation-delay: 1.8s; }
  @keyframes sticker-sway{
    0%,100%{ transform: rotate(-4deg) translateY(0); }
    50%{ transform: rotate(4deg) translateY(-6px); }
  }
  @media (max-width: 480px){
    .sticker{ width: 56px; }
    .s2, .s3{ width: 48px; }
  }

  /* ===== INTRO (envelope) ===== */
  .intro{
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .intro.hide{
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
  }
  .intro-title{
    font-family: 'Dancing Script', cursive;
    font-size: 3rem;
    color: var(--seal-dark);
    margin: 0;
    text-shadow: 0 4px 10px rgba(200,130,0,0.25);
  }

  .envelope-dodge{
    transition: transform 0.45s cubic-bezier(.34,1.6,.4,1);
  }
  .envelope-outer{
    animation: env-sway 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes env-sway{
    0%,100%{ transform: rotate(-3deg); }
    50%{ transform: rotate(3deg); }
  }

  .envelope{
    position: relative;
    width: 260px;
    height: 172px;
    cursor: pointer;
  }
  .envelope.pulse{
    animation: envelope-pulse 0.65s ease-in-out;
  }
  @keyframes envelope-pulse{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    20%{ transform: translateX(-9px) rotate(-4deg); }
    40%{ transform: translateX(7px) rotate(3deg); }
    60%{ transform: translateX(-5px) rotate(-2deg); }
    80%{ transform: translateX(3px) rotate(1deg); }
  }
  .envelope-body{
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #fff8df, #ffe9a8);
    border-radius: 10px;
    box-shadow: 0 18px 30px rgba(180,120,0,0.28);
  }
  .envelope-body::before{
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 49.4%, rgba(180,120,0,0.12) 50%, transparent 50.6%),
      linear-gradient(45deg, transparent 49.4%, rgba(180,120,0,0.12) 50%, transparent 50.6%);
    border-radius: 10px;
  }
  .flap{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 92px;
    background: linear-gradient(160deg, #ffe8a0, #ffd25c);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(.6,-0.2,.3,1.4);
    z-index: 3;
  }
  .envelope.open .flap{ transform: rotateX(180deg); }
  .seal{
    position: absolute;
    top: 78px; left: 50%;
    transform: translate(-50%, -50%);
    width: 46px; height: 46px;
    z-index: 4;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .seal img{ width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(190,120,0,0.35)); }
  .envelope.open .seal{ opacity: 0; transform: translate(-50%,-50%) scale(0.4); }

  .hint{
    font-size: 1.15rem;
    color: var(--seal-dark);
    letter-spacing: 0.04em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }
  @keyframes hint-pulse{
    0%,100%{ opacity: 0.55; }
    50%{ opacity: 1; }
  }

  /* ===== FLYBY IMAGES (cruzan la pantalla tipo avioncito) ===== */
  .flyby-layer{
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
  }
  .flyby{
    position: fixed;
    left: 0;
    top: 0;
    width: var(--size, 90px);
    opacity: 0;
    animation: fly-across var(--dur, 13s) linear infinite;
    animation-delay: var(--delay, 0s);
    animation-fill-mode: backwards;
  }
  @keyframes fly-across{
    0%{   transform: translate(var(--x0), var(--y0)); opacity: 0; }
    6%{   opacity: 1; }
    94%{  opacity: 1; }
    100%{ transform: translate(var(--x1), var(--y1)); opacity: 0; }
  }
  .flyby-spin{
    animation: cartoon-wiggle 8s steps(1) infinite;
  }
  .flyby-spin img{
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 8px 10px rgba(150,100,10,0.3));
  }
  @keyframes cartoon-wiggle{
    0%{   transform: rotate(-4deg) translateY(0); }
    12.5%{ transform: rotate(3deg) translateY(-4px); }
    25%{  transform: rotate(-2deg) translateY(2px); }
    37.5%{ transform: rotate(4deg) translateY(-3px); }
    50%{  transform: rotate(-3deg) translateY(1px); }
    62.5%{ transform: rotate(2deg) translateY(-4px); }
    75%{  transform: rotate(-4deg) translateY(0); }
    87.5%{ transform: rotate(3deg) translateY(2px); }
    100%{ transform: rotate(-4deg) translateY(0); }
  }

  /* ===== LETTER ===== */
  .letter{
    position: fixed;
    z-index: 10;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.35);
    width: min(88vw, 480px);
    max-height: 82vh;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 16px;
    padding: 2.2rem 1.8rem 2rem;
    box-shadow: 0 30px 60px rgba(170,110,0,0.35);
    opacity: 0;
    pointer-events: none;
  }
  .letter-mark{
    display: block;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: 2rem;
    margin-bottom: 1.2rem;
    letter-spacing: 0.03em;
  }

  @keyframes letter-grow-shake{
    0%{   opacity: 0;   transform: translate(-50%,-50%) scale(0.35) rotate(0deg); }
    6%{   opacity: 1; }
    10%{  transform: translate(calc(-50% - 10px),-50%) scale(0.42) rotate(-4deg); }
    20%{  transform: translate(calc(-50% + 9px),-50%)  scale(0.53) rotate(3.5deg); }
    30%{  transform: translate(calc(-50% - 8px),-50%)  scale(0.65) rotate(-3deg); }
    40%{  transform: translate(calc(-50% + 6px),-50%)  scale(0.77) rotate(2.4deg); }
    50%{  transform: translate(calc(-50% - 5px),-50%)  scale(0.87) rotate(-1.8deg); }
    60%{  transform: translate(calc(-50% + 4px),-50%)  scale(0.95) rotate(1.2deg); }
    70%{  transform: translate(calc(-50% - 3px),-50%)  scale(1.02) rotate(-0.7deg); }
    80%{  transform: translate(calc(-50% + 2px),-50%)  scale(1.01) rotate(0.4deg); }
    90%{  transform: translate(calc(-50% - 1px),-50%)  scale(1.0) rotate(-0.2deg); }
    100%{ opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  .letter.grow-shake{
    animation: letter-grow-shake 1.3s cubic-bezier(.2,.7,.3,1) forwards;
    pointer-events: auto;
  }

  .msg-wrap{ position: relative; }
  .msg-block{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink);
    font-size: 1.18rem;
    line-height: 1.8;
    text-align: center;
    margin: 0 0 1.4rem;
    opacity: 0;
  }
  .msg-block.fade-in{
    animation: msg-fade 0.6s ease forwards;
  }
  @keyframes msg-fade{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .msg-peek{
    cursor: pointer;
    text-align: center;
    padding: 0.4rem 0 0.2rem;
  }
  .msg-peek p{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink);
    opacity: 0.28;
    filter: blur(1.6px);
    margin: 0 0 0.5rem;
    transition: opacity 0.3s ease, filter 0.3s ease;
    -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
            mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
  }
  .msg-peek:active p{ opacity: 0.45; filter: blur(0.8px); }
  .peek-hint{
    display: inline-block;
    font-family: 'Dancing Script', cursive;
    font-size: 1.05rem;
    color: var(--seal-dark);
    letter-spacing: 0.03em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }

  .msg-sign{
    font-family: 'Dancing Script', cursive;
    font-size: 1.3rem;
    text-align: center;
    color: var(--seal-dark);
    margin-top: 0.6rem;
  }

  /* ===== BURST (corazones + confeti) ===== */
  .burst{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }
  .burst img, .burst .confetti{
    position: absolute;
    top: 50%;
    left: 50%;
    opacity: 0;
    animation: burst-out 1.6s ease-out forwards;
  }
  .burst img{
    width: 24px;
    height: auto;
    filter: drop-shadow(0 0 8px rgba(255,180,60,0.75)) drop-shadow(0 2px 3px rgba(150,100,10,0.35));
  }
  .burst .confetti{
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }
  @keyframes burst-out{
    0%{ transform: translate(-50%,-50%) scale(0.3) rotate(0deg); opacity: 0; }
    12%{ opacity: 1; }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .ambient span, .hint, .sticker, .peek-hint{ animation: none; }
    .flap, .letter, .seal{ transition-duration: 0.2s; }
    .letter.grow-shake{ animation: none; opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="ambient" id="ambient"></div>
  <div class="flyby-layer" id="flybyLayer"></div>

  <div class="intro" id="intro">
    <h1 class="intro-title">&lt;3</h1>
    <div class="envelope-dodge" id="envelopeDodge">
      <div class="envelope-outer">
        <div class="envelope" id="envelope">
          <div class="envelope-body"></div>
          <div class="seal" id="seal"><img src="assets/corazon.png" alt=""></div>
          <div class="flap" id="flap"></div>
        </div>
      </div>
    </div>
    <p class="hint">toca el sobre</p>
  </div>

  <div class="letter" id="letter">
    <span class="letter-mark">¡feliz cumpleaños!</span>
    <div class="msg-wrap">
      <p class="msg-block" id="msgBlock"></p>
      <div class="msg-peek" id="msgPeek">
        <p id="msgPeekText"></p>
        <span class="peek-hint">toca para seguir leyendo</span>
      </div>
      <p class="msg-sign" id="msgSign" style="display:none;">🫀🥳🫀</p>
    </div>
  </div>

  <div class="burst" id="burst"></div>
</div>

<audio id="bgMusic" src="assets/musica.mp3" loop preload="auto"></audio>

<script>
  const ambient = document.getElementById('ambient');
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = (60 + Math.random()*40) + '%';
    s.style.animationDelay = (Math.random()*7) + 's';
    s.style.animationDuration = (5 + Math.random()*4) + 's';
    s.style.transform = 'scale(' + (0.6 + Math.random()*0.9) + ')';
    ambient.appendChild(s);
  }

  const flybyLayer = document.getElementById('flybyLayer');
  const flybyImages = [
    'assets/gato-angel.gif',
    'assets/banner-cumple.gif',
    'assets/pastel-anim.gif',
    'assets/hellokitty-confeti.gif',
    'assets/kuromi-pastel.gif',
    'assets/sanrio-grupo.jpg',
    'assets/gato-sombrero1.jpg',
    'assets/gato-sombrero2.jpg',
    'assets/gatito-pastel.jpg'
  ];
  const diagonals = [
    { x0: '-25vw', y0: '115vh', x1: '125vw', y1: '-25vh' }, // abajo-izq -> arriba-der
    { x0: '125vw', y0: '-25vh', x1: '-25vw', y1: '115vh' }, // arriba-der -> abajo-izq
    { x0: '-25vw', y0: '-25vh', x1: '125vw', y1: '115vh' }, // arriba-izq -> abajo-der
    { x0: '125vw', y0: '115vh', x1: '-25vw', y1: '-25vh' }  // abajo-der -> arriba-izq
  ];

  flybyImages.forEach((src, i) => {
    const diag = diagonals[i % diagonals.length];
    const wrap = document.createElement('div');
    wrap.className = 'flyby';
    wrap.style.setProperty('--x0', diag.x0);
    wrap.style.setProperty('--y0', diag.y0);
    wrap.style.setProperty('--x1', diag.x1);
    wrap.style.setProperty('--y1', diag.y1);
    wrap.style.setProperty('--size', (70 + Math.random()*45) + 'px');
    wrap.style.setProperty('--dur', (11 + Math.random()*6) + 's');
    wrap.style.setProperty('--delay', (i*1.4 + Math.random()*2) + 's');

    const spin = document.createElement('div');
    spin.className = 'flyby-spin';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    spin.appendChild(img);
    wrap.appendChild(spin);
    flybyLayer.appendChild(wrap);
  });

  const envelope = document.getElementById('envelope');
  const envelopeDodge = document.getElementById('envelopeDodge');
  const intro = document.getElementById('intro');
  const letter = document.getElementById('letter');
  const burstLayer = document.getElementById('burst');
  const bgMusic = document.getElementById('bgMusic');

  const msgBlockEl = document.getElementById('msgBlock');
  const msgPeek = document.getElementById('msgPeek');
  const msgPeekText = document.getElementById('msgPeekText');
  const msgSign = document.getElementById('msgSign');

  // EDITA ESTE ARREGLO con tu mensaje real, cada elemento es un bloque
  // que se va a mostrar de a poco (el usuario toca para ver el siguiente).
  const msgBlocks = [
    "Olaa Feliz cumpleaños\nespero que la pases muy bien\nte quiero mucho,\naquí en las estrellas y la luna,",
    "espero cumplas muchos más\ny espero no olvides\nlo importante que eres para mi,\ncome mucha torta",
    "cuídate\nte quiero muchisiimo"
  ];
  let current = 0;

  function renderMsg(){
    msgBlockEl.classList.remove('fade-in');
    msgBlockEl.innerHTML = msgBlocks[current].split('\n').join('<br>');
    void msgBlockEl.offsetWidth;
    msgBlockEl.classList.add('fade-in');

    if(current + 1 < msgBlocks.length){
      const nextFirstLine = msgBlocks[current + 1].split('\n')[0];
      msgPeekText.innerHTML = nextFirstLine;
      msgPeek.style.display = 'block';
      msgSign.style.display = 'none';
    } else {
      msgPeek.style.display = 'none';
      msgSign.style.display = 'block';
    }
  }

  msgPeek.addEventListener('click', () => {
    if(current + 1 < msgBlocks.length){
      current++;
      renderMsg();
    }
  });

  const confettiColors = ['#ff9f1c', '#ffd23f', '#ff6b35', '#ffbf69', '#f7b801', '#ffe066'];

  function spawnParticle(x, y, dx, dy, rot, delay){
    const isHeart = Math.random() < 0.5;
    let p;
    if(isHeart){
      p = document.createElement('img');
      p.src = 'assets/corazon.png';
      p.alt = '';
      p.style.width = (12 + Math.random()*12) + 'px';
    } else {
      p = document.createElement('div');
      p.className = 'confetti';
      p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      p.style.width = (7 + Math.random()*6) + 'px';
      p.style.height = (10 + Math.random()*8) + 'px';
    }
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--dy', dy + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    p.style.left = x;
    p.style.top = y;
    p.style.animationDelay = delay + 's';
    burstLayer.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }

  function heartBurst(count){
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const dist = 120 + Math.random()*260;
      spawnParticle('50%', '45%', Math.cos(angle)*dist, Math.sin(angle)*dist, Math.random()*360-180, Math.random()*0.25);
    }
  }

  function burstAt(x, y, count){
    const scale = 6;
    for(let i=0;i<count;i++){
      const t = (i / count) * Math.PI * 2;
      const dx = scale * 16 * Math.pow(Math.sin(t), 3);
      const dy = -scale * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      spawnParticle(x+'px', y+'px', dx, dy, Math.random()*360-180, (i/count)*0.18 + Math.random()*0.05);
    }
  }

  document.addEventListener('click', (e) => {
    burstAt(e.clientX, e.clientY, 20);
  });

  const envelopePulse = setInterval(() => {
    envelope.classList.add('pulse');
    setTimeout(() => envelope.classList.remove('pulse'), 700);
  }, 3000);

  let envelopeTaps = 0;
  let dodgeDir = 1;
  let musicStarted = false;

  envelope.addEventListener('click', () => {
    if(!musicStarted){
      bgMusic.play().catch(() => {});
      musicStarted = true;
    }

    envelopeTaps++;

    if(envelopeTaps < 3){
      const dist = 70 + Math.random()*35;
      envelopeDodge.style.transform = 'translateY(' + (dodgeDir * -dist) + 'px)';
      dodgeDir *= -1;
      return;
    }

    envelopeDodge.style.transform = 'translateY(0)';
    clearInterval(envelopePulse);
    envelope.classList.remove('pulse');
    envelope.classList.add('open');
    heartBurst(46);

    setTimeout(() => {
      intro.classList.add('hide');
      letter.classList.add('grow-shake');
    }, 650);
  });

  letter.addEventListener('animationend', function onGrowShake(e){
    if(e.animationName === 'letter-grow-shake'){
      renderMsg();
      letter.removeEventListener('animationend', onGrowShake);
    }
  });
</script>
</body>
</html>
