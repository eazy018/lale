<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top: #fff3d6;
    --bg-mid: #ffcf86;
    --bg-low: #ff9a56;
    --bg-bottom: #ef6a4c;
    --ink: #5a2a1c;
    --gold: #ff9d3d;
    --seal: #e2572c;
    --seal-dark: #b8401e;
    --paper: #fff8ee;
    --paper-edge: #ffe3bd;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 38%, var(--bg-low) 70%, var(--bg-bottom) 100%);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .scene{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== AMBIENT SPARKLES ===== */
  .ambient{ position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .ambient span{
    position: absolute;
    width: 10px; height: 10px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    opacity: 0.55;
    animation: float-up 7s ease-in-out infinite;
  }
  @keyframes float-up{
    0%{ transform: translateY(0) rotate(0deg); opacity: 0; }
    15%{ opacity: 0.6; }
    50%{ transform: translateY(-40px) rotate(180deg); }
    85%{ opacity: 0.5; }
    100%{ transform: translateY(-90px) rotate(360deg); opacity: 0; }
  }

  /* ===== STICKERS ===== */
  .sticker{
    position: fixed;
    width: 78px;
    opacity: 0.85;
    z-index: 2;
    filter: drop-shadow(0 8px 10px rgba(120,40,20,0.25));
    animation: sticker-sway 5s ease-in-out infinite;
  }
  .sticker img{ width: 100%; height: auto; display: block; }
  .s1{ top: 6%; left: 6%; animation-delay: 0s; }
  .s2{ top: 8%; right: 7%; width: 66px; animation-delay: 1.2s; }
  .s3{ bottom: 8%; left: 8%; width: 66px; animation-delay: 0.6s; }
  .s4{ bottom: 6%; right: 6%; animation-delay: 1.8s; }
  @keyframes sticker-sway{
    0%,100%{ transform: rotate(-4deg) translateY(0); }
    50%{ transform: rotate(4deg) translateY(-6px); }
  }
  @media (max-width: 480px){
    .sticker{ width: 56px; }
    .s2, .s3{ width: 48px; }
  }

  /* ===== INTRO (envelope) ===== */
  .intro{
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .intro.hide{
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
  }
  .intro-title{
    font-family: 'Dancing Script', cursive;
    font-size: 3rem;
    color: var(--seal-dark);
    margin: 0;
    text-shadow: 0 4px 10px rgba(180,60,20,0.25);
  }

  .envelope-outer{
    animation: env-sway 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes env-sway{
    0%,100%{ transform: rotate(-3deg); }
    50%{ transform: rotate(3deg); }
  }

  .envelope{
    position: relative;
    width: 260px;
    height: 172px;
    cursor: pointer;
  }
  .envelope.pulse{
    animation: envelope-pulse 0.65s ease-in-out;
  }
  @keyframes envelope-pulse{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    20%{ transform: translateX(-9px) rotate(-4deg); }
    40%{ transform: translateX(7px) rotate(3deg); }
    60%{ transform: translateX(-5px) rotate(-2deg); }
    80%{ transform: translateX(3px) rotate(1deg); }
  }
  .envelope-body{
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #fff2df, #ffe0b8);
    border-radius: 10px;
    box-shadow: 0 18px 30px rgba(150,50,20,0.28);
  }
  .envelope-body::before{
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 49.4%, rgba(150,60,20,0.12) 50%, transparent 50.6%),
      linear-gradient(45deg, transparent 49.4%, rgba(150,60,20,0.12) 50%, transparent 50.6%);
    border-radius: 10px;
  }
  .flap{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 92px;
    background: linear-gradient(160deg, #ffdca8, #ffc178);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(.6,-0.2,.3,1.4);
    z-index: 3;
  }
  .envelope.open .flap{ transform: rotateX(180deg); }
  .seal{
    position: absolute;
    top: 78px; left: 50%;
    transform: translate(-50%, -50%);
    width: 46px; height: 46px;
    z-index: 4;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .seal img{ width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(150,40,10,0.35)); }
  .envelope.open .seal{ opacity: 0; transform: translate(-50%,-50%) scale(0.4); }

  .hint{
    font-size: 1.15rem;
    color: var(--seal-dark);
    letter-spacing: 0.04em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }
  @keyframes hint-pulse{
    0%,100%{ opacity: 0.55; }
    50%{ opacity: 1; }
  }

  /* ===== LETTER ===== */
  .letter{
    position: fixed;
    z-index: 10;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.35);
    width: min(88vw, 480px);
    max-height: 82vh;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 16px;
    padding: 2.2rem 1.8rem 2rem;
    box-shadow: 0 30px 60px rgba(140,40,15,0.35);
    opacity: 0;
    pointer-events: none;
  }
  .letter-mark{
    display: block;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: 1.5rem;
    margin-bottom: 1.2rem;
    letter-spacing: 0.04em;
  }

  @keyframes letter-grow-shake{
    0%{   opacity: 0;   transform: translate(-50%,-50%) scale(0.35) rotate(0deg); }
    6%{   opacity: 1; }
    10%{  transform: translate(calc(-50% - 10px),-50%) scale(0.42) rotate(-4deg); }
    20%{  transform: translate(calc(-50% + 9px),-50%)  scale(0.53) rotate(3.5deg); }
    30%{  transform: translate(calc(-50% - 8px),-50%)  scale(0.65) rotate(-3deg); }
    40%{  transform: translate(calc(-50% + 6px),-50%)  scale(0.77) rotate(2.4deg); }
    50%{  transform: translate(calc(-50% - 5px),-50%)  scale(0.87) rotate(-1.8deg); }
    60%{  transform: translate(calc(-50% + 4px),-50%)  scale(0.95) rotate(1.2deg); }
    70%{  transform: translate(calc(-50% - 3px),-50%)  scale(1.02) rotate(-0.7deg); }
    80%{  transform: translate(calc(-50% + 2px),-50%)  scale(1.01) rotate(0.4deg); }
    90%{  transform: translate(calc(-50% - 1px),-50%)  scale(1.0) rotate(-0.2deg); }
    100%{ opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  .letter.grow-shake{
    animation: letter-grow-shake 1.3s cubic-bezier(.2,.7,.3,1) forwards;
    pointer-events: auto;
  }

  .poem-wrap{ position: relative; }
  .poem-block{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink);
    font-size: 1.18rem;
    line-height: 1.8;
    text-align: center;
    margin: 0 0 1.4rem;
    opacity: 0;
  }
  .poem-block.fade-in{
    animation: poem-fade 0.6s ease forwards;
  }
  @keyframes poem-fade{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .poem-peek{
    cursor: pointer;
    text-align: center;
    padding: 0.4rem 0 0.2rem;
  }
  .poem-peek p{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink);
    opacity: 0.28;
    filter: blur(1.6px);
    margin: 0 0 0.5rem;
    transition: opacity 0.3s ease, filter 0.3s ease;
    -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
            mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
  }
  .poem-peek:active p{ opacity: 0.45; filter: blur(0.8px); }
  .peek-hint{
    display: inline-block;
    font-family: 'Dancing Script', cursive;
    font-size: 1.05rem;
    color: var(--seal-dark);
    letter-spacing: 0.03em;
    animation: hint-pulse 1.8s ease-in-out infinite;
  }

  .poem-sign{
    font-family: 'Dancing Script', cursive;
    font-size: 1.3rem;
    text-align: center;
    color: var(--seal-dark);
    margin-top: 0.6rem;
  }

  /* ===== HEART BURST ===== */
  .burst{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }
  .burst img{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 24px;
    height: auto;
    opacity: 0;
    animation: burst-out 1.6s ease-out forwards;
    filter: drop-shadow(0 0 8px rgba(255,140,60,0.75)) drop-shadow(0 2px 3px rgba(150,40,10,0.35));
  }
  @keyframes burst-out{
    0%{ transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    12%{ opacity: 1; }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .ambient span, .hint, .sticker, .peek-hint{ animation: none; }
    .flap, .letter, .seal{ transition-duration: 0.2s; }
    .letter.grow-shake{ animation: none; opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="ambient" id="ambient"></div>

  <div class="sticker s1"><img src="assets/doodle-carita.jpg" alt=""></div>
  <div class="sticker s2"><img src="assets/doodle-conejo.jpg" alt=""></div>
  <div class="sticker s3"><img src="assets/doodle-abrazo.jpg" alt=""></div>
  <div class="sticker s4"><img src="assets/doodle-alien.jpg" alt=""></div>

  <div class="intro" id="intro">
    <h1 class="intro-title">pala tu &lt;3</h1>
    <div class="envelope-outer">
      <div class="envelope" id="envelope">
        <div class="envelope-body"></div>
        <div class="seal" id="seal"><img src="assets/corazon.png" alt=""></div>
        <div class="flap" id="flap"></div>
      </div>
    </div>
    <p class="hint">toca el sobre</p>
  </div>

  <div class="letter" id="letter">
    <span class="letter-mark">si sabes k te amo?</span>
    <div class="poem-wrap">
      <p class="poem-block" id="poemBlock"></p>
      <div class="poem-peek" id="poemPeek">
        <p id="poemPeekText"></p>
        <span class="peek-hint">toca para seguir leyendo</span>
      </div>
      <p class="poem-sign" id="poemSign" style="display:none;">tuyo, siempre</p>
    </div>
  </div>

  <div class="burst" id="burst"></div>
</div>

<audio id="bgMusic" src="assets/musica-novia.mp3" loop preload="auto"></audio>

<script>
  const ambient = document.getElementById('ambient');
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = (60 + Math.random()*40) + '%';
    s.style.animationDelay = (Math.random()*7) + 's';
    s.style.animationDuration = (5 + Math.random()*4) + 's';
    s.style.transform = 'scale(' + (0.6 + Math.random()*0.9) + ')';
    ambient.appendChild(s);
  }

  const envelope = document.getElementById('envelope');
  const intro = document.getElementById('intro');
  const letter = document.getElementById('letter');
  const bgMusic = document.getElementById('bgMusic');
  const burstLayer = document.getElementById('burst');

  const poemBlockEl = document.getElementById('poemBlock');
  const poemPeek = document.getElementById('poemPeek');
  const poemPeekText = document.getElementById('poemPeekText');
  const poemSign = document.getElementById('poemSign');

  const poemBlocks = [
    "cada silencio compartido,\nporque hasta callados decimos tanto.\nY en esa orilla donde tu mirada rompe como marea,\nentendi que no necesitaba inventar un dia para amarte,",
    "porque ya te amo todos, sin fecha, sin excusa.\nEres el puerto al que mi barco fragil siempre vuelve,\naunque lo zarandeen las tormentas.\nY si algun dia el mar de mi conciencia se calma,",
    "sera solo porque por fin llegue a ti,\ny ahi, en tus ojos, decidi quedarme para siempre.\nEres la luna que gobierna las mareas de mi conciencia,\nla que decide cuando mi mar se alborota",
    "y cuando se queda quieto solo para contemplarte.\nHubo tormentas, mi amor, noches donde el barco crujia\ny el viento parecia llevarse todo,\npero tu nombre fue el ancla que me mantuvo cerca de la orilla.",
    "No hay tempestad que no resista si al final del camino estas tu.\nSueño con los puertos que aun no hemos tocado juntos,\ncon horizontes nuevos donde tu mano siga siendo mi mapa.\nPorque no busco un mar tranquilo, busco navegarlo contigo,",
    "aunque haya olas, aunque haya calma, aunque haya noches sin estrellas\nporque tu risa es la luz que guia este barco cuando todo lo demas se apaga.\nY si algun dia me preguntan que es el amor,\ndire que es esto: pensar en ti antes de dormir y al despertar,",
    "sentir que cada beso tuyo es un puerto seguro,\ny saber que no importa cuantas mareas cambien,\nmi amor por ti sera la unica constante.\nTe amo hoy, te amo mañana, te amo en cada version de este mar que soy."
  ];
  let current = 0;

  function renderPoem(){
    poemBlockEl.classList.remove('fade-in');
    poemBlockEl.innerHTML = poemBlocks[current].split('\n').join('<br>');
    void poemBlockEl.offsetWidth;
    poemBlockEl.classList.add('fade-in');

    if(current + 1 < poemBlocks.length){
      const nextFirstLine = poemBlocks[current + 1].split('\n')[0];
      poemPeekText.innerHTML = nextFirstLine;
      poemPeek.style.display = 'block';
      poemSign.style.display = 'none';
    } else {
      poemPeek.style.display = 'none';
      poemSign.style.display = 'block';
    }
  }

  poemPeek.addEventListener('click', () => {
    if(current + 1 < poemBlocks.length){
      current++;
      renderPoem();
    }
  });

  function heartBurst(count){
    for(let i=0;i<count;i++){
      const h = document.createElement('img');
      h.src = 'assets/corazon.png';
      h.alt = '';
      const angle = Math.random()*Math.PI*2;
      const dist = 120 + Math.random()*260;
      h.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      h.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      h.style.setProperty('--rot', (Math.random()*360-180) + 'deg');
      h.style.left = '50%';
      h.style.top = '45%';
      h.style.width = (18 + Math.random()*16) + 'px';
      h.style.animationDelay = (Math.random()*0.25) + 's';
      burstLayer.appendChild(h);
      setTimeout(() => h.remove(), 2000);
    }
  }

  function heartBurstAt(x, y, count){
    const scale = 6;
    for(let i=0;i<count;i++){
      const h = document.createElement('img');
      h.src = 'assets/corazon.png';
      h.alt = '';
      const t = (i / count) * Math.PI * 2;
      const dx = scale * 16 * Math.pow(Math.sin(t), 3);
      const dy = -scale * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      h.style.setProperty('--dx', dx + 'px');
      h.style.setProperty('--dy', dy + 'px');
      h.style.setProperty('--rot', (Math.random()*360-180) + 'deg');
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.width = (12 + Math.random()*8) + 'px';
      h.style.animationDelay = ((i/count)*0.18 + Math.random()*0.05) + 's';
      burstLayer.appendChild(h);
      setTimeout(() => h.remove(), 2000);
    }
  }

  document.addEventListener('click', (e) => {
    heartBurstAt(e.clientX, e.clientY, 20);
  });

  const envelopePulse = setInterval(() => {
    envelope.classList.add('pulse');
    setTimeout(() => envelope.classList.remove('pulse'), 700);
  }, 3000);

  envelope.addEventListener('click', () => {
    clearInterval(envelopePulse);
    envelope.classList.remove('pulse');
    envelope.classList.add('open');
    bgMusic.play().catch(() => {});
    heartBurst(46);

    setTimeout(() => {
      intro.classList.add('hide');
      letter.classList.add('grow-shake');
    }, 650);
  });

  letter.addEventListener('animationend', function onGrowShake(e){
    if(e.animationName === 'letter-grow-shake'){
      renderPoem();
      letter.removeEventListener('animationend', onGrowShake);
    }
  });
</script>
</body>
</html>
